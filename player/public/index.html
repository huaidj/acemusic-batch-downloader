<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>壞 DJ · 播放器</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="workspace">
    <aside class="sidebar" aria-label="曲庫導覽">
      <div class="brand"><span class="brand-mark" aria-hidden="true">H</span><div><strong>HuaiDJ <span>PLAYER</span></strong><small>壞 DJ · 播放器</small></div></div>
      <nav id="navigation" aria-label="檢視"></nav>
      <div class="playlist-heading"><span>播放清單</span><button id="new-playlist" class="icon-button" title="新增播放清單" aria-label="新增播放清單">＋</button></div>
      <nav id="playlists" aria-label="播放清單"></nav>
      <div class="sidebar-foot"><span id="hub-status" class="connection">正在連接曲庫…</span><small>本機播放 · 不觸發生成</small></div>
    </aside>

    <main class="main-pane">
      <header class="page-heading"><div><span class="eyebrow">LOCAL LIBRARY</span><h1 id="view-title">曲庫</h1></div><div class="heading-actions"><button id="compact-toggle" title="只顯示播放控制">精簡播放</button><button id="toggle-inspector" aria-expanded="false">詳細 / 佇列</button><button id="refresh-library" title="重新掃描本機檔案">刷新曲庫</button></div></header>
      <div id="notice" class="notice" role="status" hidden></div>
      <div id="recovery-notice" class="notice" role="status" hidden></div>
      <div class="command-bar">
        <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜尋曲名、檔名或路徑" aria-label="搜尋曲名、檔名或路徑" autocomplete="off"></label>
        <select id="status-filter" aria-label="下載狀態"><option value="all">所有狀態</option><option value="missing">缺 MP3 / WAV</option><option value="uncertain">待核對</option><option value="damaged">損壞</option><option value="available">有本機音檔</option></select>
        <select id="format-filter" aria-label="檔案格式"><option value="all">所有格式</option><option value="mp3">MP3</option><option value="wav">WAV</option><option value="stem">分軌</option></select>
      </div>
      <div class="scope-bar"><span id="scope-count">讀取本機曲庫…</span><div id="view-actions"></div></div>
      <div id="table-scroll" class="table-scroll" tabindex="0" aria-label="歌曲清單"><table id="library-table"><thead id="table-head"></thead><tbody id="table-body"></tbody></table><div id="empty-state" class="empty-state" hidden></div></div>
      <div class="library-status"><span id="library-summary">正在讀取…</span><span id="save-status" aria-live="polite"></span></div>
    </main>

    <aside class="inspector" aria-label="歌曲詳細與播放佇列">
      <div class="inspector-tabs" role="tablist"><button id="detail-tab" role="tab" aria-selected="true">歌曲詳細</button><button id="queue-tab" role="tab" aria-selected="false">播放佇列 <span id="queue-count">0</span></button><button id="close-inspector" class="inspector-close" aria-label="關閉詳細面板" title="關閉詳細面板">✕</button></div>
      <section id="detail-content" class="detail-content"></section>
      <section id="queue-content" class="queue-content" hidden><div class="queue-tools"><span>依序播放</span><button id="clear-queue" class="text-button">清空</button></div><ol id="queue-list"></ol></section>
    </aside>
  </div>

  <button id="compact-exit" class="compact-exit" title="返回完整曲庫">返回曲庫</button>
  <footer class="player" aria-label="播放器">
    <div class="now-playing"><div class="now-art" aria-hidden="true"><span>♪</span></div><div class="now-description"><strong id="now-title">選一首歌，開始播放</strong><span id="now-subtitle">點兩下歌曲，或按歌曲旁的播放鍵</span></div><button id="now-favorite" class="icon-button" title="收藏目前歌曲" aria-label="收藏目前歌曲" aria-pressed="false" disabled></button></div>
    <div class="transport"><div class="transport-buttons"><button id="shuffle" class="icon-button" aria-label="隨機播放" aria-pressed="false"></button><button id="previous" class="icon-button" aria-label="上一首" title="上一首 · Alt + ←"></button><button id="play-pause" class="play-button" aria-label="播放" title="播放 / 暫停 · Space"></button><button id="next" class="icon-button" aria-label="下一首" title="下一首 · Alt + →"></button><button id="repeat" class="icon-button" aria-label="循環關閉" title="切換循環模式"></button></div><div class="seek-line"><time id="elapsed">0:00</time><input id="seek" type="range" min="0" max="1000" step="1" value="0" aria-label="播放進度" disabled><time id="duration">0:00</time></div></div>
    <div class="player-settings"><label class="format-choice"><span>播放格式</span><select id="play-format" aria-label="播放格式"><option value="auto">優先 MP3</option><option value="mp3">MP3</option><option value="wav">WAV</option></select></label><div class="volume-line"><button id="mute" class="icon-button" aria-label="靜音"></button><input id="volume" type="range" min="0" max="100" value="80" aria-label="音量"><span id="volume-value">80</span></div></div>
  </footer>
  <audio id="audio" preload="metadata"></audio><audio id="preload-audio" preload="metadata" aria-hidden="true"></audio>

  <dialog id="playlist-dialog"><form id="playlist-form"><h2 id="playlist-dialog-title">新增播放清單</h2><label>名稱<input id="playlist-name" maxlength="80" required autocomplete="off"></label><div class="dialog-actions"><button type="button" id="cancel-playlist">取消</button><button type="submit" class="primary">儲存</button></div></form></dialog>
  <dialog id="add-dialog"><form id="add-form"><h2>加入播放清單</h2><label>播放清單<select id="add-playlist-choice" required></select></label><p id="add-description" class="muted"></p><div class="dialog-actions"><button type="button" id="cancel-add">取消</button><button type="submit" class="primary">加入</button></div></form></dialog>
  <dialog id="recovery-dialog" class="recovery-dialog"><h2>未儲存的播放資料</h2><label>本機草稿<select id="recovery-choice"></select></label><div id="recovery-comparison" class="recovery-comparison"></div><p id="recovery-reason" class="muted"></p><div class="dialog-actions"><button id="close-recovery" type="button">保留，稍後處理</button><button id="export-recovery" type="button">匯出草稿</button><button id="apply-recovery" type="button" class="primary">套用此草稿</button></div><button id="discard-recovery" type="button" class="text-button">捨棄此本機草稿</button></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
